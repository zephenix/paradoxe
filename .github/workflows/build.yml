# =============================================================================
# Intégration et publication continues de PARADOXE
#
#  - À chaque Pull Request et à chaque push sur main : installation de Godot,
#    tests automatisés, vérification du générateur de sons.
#  - Push sur main : export Web publié sur GitHub Pages.
#  - Tag de version (v0.1, v0.2…) : exécutables Windows et Linux (et une archive
#    de la version Web) publiés dans une GitHub Release.
#  - Lancement manuel (onglet Actions > Build > Run workflow, sur main) avec le
#    champ « release_tag » rempli (ex. v0.2) : la CI crée elle-même le tag sur le
#    commit de main, puis publie la Release. Utile quand on ne peut pas pousser
#    de tag (sessions cloud) ; les deux méthodes produisent la même Release.
#
# La version de Godot vient de setup.sh (GODOT_VERSION) : une seule source de vérité.
# =============================================================================
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de version à créer et publier (ex. v0.2). Laisser vide pour un simple build."
        required: false
        default: ""

# Sur une Pull Request, un nouveau push annule le build précédent. Sur main et
# les tags, on laisse toujours aller au bout (publication Pages / Release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache de Godot et des modèles d'export
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot
          key: godot-${{ runner.os }}-${{ hashFiles('setup.sh') }}

      - name: Installation de Godot (setup.sh)
        run: ./setup.sh --no-import

      - name: Tests automatisés (headless)
        run: ./tools/run_tests.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Le générateur de sons fonctionne
        run: |
          python -m pip install --quiet -r tools/audio/requirements.txt
          python tools/audio/generate_sounds.py --out "$RUNNER_TEMP/sounds"

      - name: Mixage équilibré (niveaux des familles de sons)
        run: python tools/audio/measure_levels.py

  # ---------------------------------------------------------------------------
  web:
    name: Export Web
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/godot
          key: godot-${{ runner.os }}-${{ hashFiles('setup.sh') }}

      - run: ./setup.sh --no-import

      - name: Export Web
        run: |
          base="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          GAME_VERSION="${base}+${GITHUB_SHA::7}" ./tools/export.sh web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  pages:
    name: Publication GitHub Pages
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  release:
    name: Release (Windows, Linux, Web)
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Tag poussé (v0.1…) ou tag demandé au lancement manuel.
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Vérification du tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag invalide : « $RELEASE_TAG » (attendu : v0.1, v0.2, v1.0.1…)" >&2
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/godot
          key: godot-${{ runner.os }}-${{ hashFiles('setup.sh') }}

      - run: ./setup.sh --no-import

      - name: Exports Windows, Linux et Web
        run: |
          version="${RELEASE_TAG#v}"
          # v0.1 -> 0.1.0 (format X.Y.Z attendu par les métadonnées Windows)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="${version}.0"; fi
          GAME_VERSION="$version" ./tools/export.sh all

      - name: Préparation des fichiers
        run: |
          tag="$RELEASE_TAG"
          mkdir -p dist
          cp build/windows/Paradoxe.exe "dist/Paradoxe-${tag}-windows.exe"
          # zip conserve le droit d'exécution du binaire Linux
          (cd build/linux && zip -q "../../dist/Paradoxe-${tag}-linux.zip" Paradoxe.x86_64)
          (cd build/web && zip -q -r "../../dist/Paradoxe-${tag}-web.zip" .)
          ls -la dist
          ./tools/release_notes.sh "$tag" > dist/NOTES.md
          cat dist/NOTES.md

      - name: Publication de la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Paradoxe-* --clobber
          else
            # --target : si le tag n'existe pas encore (lancement manuel), GitHub le
            # crée sur ce commit. S'il existe déjà (tag poussé), il est réutilisé.
            gh release create "$tag" dist/Paradoxe-* --title "PARADOXE $tag" \
              --notes-file dist/NOTES.md --target "$GITHUB_SHA"
          fi
