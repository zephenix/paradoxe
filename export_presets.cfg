html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"PARADOXE — prototype de jeu de plateforme cinématique (Godot 4).\"><script>/* PARADOXE, deux aides autour du service worker de Godot (qui ajoute les en-tetes d'isolation necessaires au multithread et garde une copie du jeu en cache). 1) Premier chargement : Godot recharge parfois la page avant que le service worker soit actif ; on attend qu'il le soit et on recharge une seule fois. 2) Mise a jour : une nouvelle version du jeu installe un nouveau service worker qui attendrait, sinon, la fermeture de tous les onglets ; on lui demande de prendre la main tout de suite (message 'update'), puis on recharge la page des qu'il est actif. On cherche une mise a jour au chargement (le navigateur en cherche aussi une de son cote). Si la nouvelle version n'est prete que plus de 20 s apres le chargement, on ne recharge pas en pleine partie : elle sera prise a la visite suivante. */(function(){if(!('serviceWorker' in navigator)){return;}var key='paradoxe-sw-reload';var start=Date.now();navigator.serviceWorker.getRegistration().then(function(reg){if(!reg){return;}if(!window.crossOriginIsolated&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');navigator.serviceWorker.ready.then(function(){window.location.reload();});return;}if(!navigator.serviceWorker.controller){return;}var reloaded=false;var activate=function(w){if(!w||reloaded){return;}if(Date.now()-start>20000){console.log('PARADOXE : nouvelle version prete, chargee a la prochaine visite');return;}console.log('PARADOXE : nouvelle version trouvee, activation');w.addEventListener('statechange',function(){if(w.state==='activated'&&!reloaded){reloaded=true;window.location.reload();}});w.postMessage('update');};var track=function(w){if(!w){return;}if(w.state==='installed'){activate(w);return;}w.addEventListener('statechange',function(){if(w.state==='installed'){activate(w);}});};track(reg.waiting);track(reg.installing);reg.addEventListener('updatefound',function(){track(reg.installing);});reg.update().catch(function(){});}).catch(function(){});})();</script>"
